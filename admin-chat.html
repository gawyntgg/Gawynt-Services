<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Member Points Admin</title>
<style>
  :root { --blue:#0284c7; --text:#1e293b; --muted:#64748b; --danger:#dc2626; --green:#059669; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#f0f9ff; color:var(--text); padding:16px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:8px 0 16px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  input { width:100%; padding:12px; font-size:16px; border:2px solid #e2e8f0; border-radius:10px; margin-bottom:10px; }
  input:focus { outline:none; border-color:var(--blue); }
  button { font-size:15px; font-weight:700; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; color:#fff; background:var(--blue); }
  button.add { background:var(--green); } button.remove { background:var(--danger); } button.set { background:#475569; }
  button.ghost { background:#e2e8f0; color:var(--text); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .member-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .name { font-weight:800; } .email { color:var(--muted); font-size:.9rem; word-break:break-all; }
  .pts { font-size:1.6rem; font-weight:800; color:var(--blue); white-space:nowrap; }
  .amount { width:110px; margin:0; }
  #msg { min-height:20px; font-weight:600; margin:0 0 10px; }
  #msg.err { color:var(--danger); } #msg.ok { color:var(--green); }
  .hidden { display:none; }
  code { background:#f1f5f9; padding:2px 6px; border-radius:6px; word-break:break-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>❄️ Member Points Admin</h1>
  <p id="msg"></p>

  <div id="login-card" class="card">
    <h3 style="margin-top:0">Admin login</h3>
    <input type="email" id="email" placeholder="Admin email" autocomplete="username">
    <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
    <button id="login-btn">Log In</button>
  </div>

  <div id="app" class="hidden">
    <div class="card row" style="justify-content:space-between">
      <span id="who" class="email"></span>
      <button class="ghost" id="logout-btn">Log Out</button>
    </div>
    <input type="text" id="search" placeholder="Search members by name or email...">
    <div id="list"></div>
  </div>

  <div id="uid-card" class="card hidden">
    <b>Permission denied.</b> Your admin UID is:<br><code id="uid"></code><br><br>
    Put this UID into your Firebase Realtime Database rules (see instructions), then refresh this page.
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBuWWnqDX5mUra5pF3uuBxEVSKjcESifTk",
  authDomain: "gawynt-hub.firebaseapp.com",
  databaseURL: "https://gawynt-hub-default-rtdb.firebaseio.com",
  projectId: "gawynt-hub",
  appId: "1:330651852035:web:db931f867da21b6a519d36"
}, 'points-admin');
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);

let members = {};
let stop = null;

function say(text, kind) { const m = $('msg'); m.textContent = text || ''; m.className = kind || ''; }
const friendly = c => ({
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/invalid-email': 'Please enter a valid email.',
  'auth/too-many-requests': 'Too many tries. Please wait and retry.'
})[c] || 'Something went wrong. Please try again.';

$('login-btn').onclick = async () => {
  say('');
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); }
  catch (e) { say(friendly(e.code), 'err'); }
};
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });
$('logout-btn').onclick = () => signOut(auth);
$('search').addEventListener('input', render);

onAuthStateChanged(auth, user => {
  if (stop) { stop(); stop = null; }
  members = {}; render();
  $('uid-card').classList.add('hidden');
  if (!user) { $('login-card').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  $('login-card').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = 'Logged in as ' + user.email;
  $('uid').textContent = user.uid;
  stop = onValue(ref(db, 'members'), snap => {
    members = snap.val() || {};
    $('uid-card').classList.add('hidden');
    render();
  }, () => {
    $('uid-card').classList.remove('hidden');
    say('Could not load members.', 'err');
  });
});

function render() {
  const list = $('list'); list.innerHTML = '';
  const q = $('search').value.trim().toLowerCase();
  const rows = Object.keys(members).map(uid => ({
    uid,
    name: (members[uid].profile && members[uid].profile.name) || '',
    email: (members[uid].profile && members[uid].profile.email) || '',
    points: Number(members[uid].points) || 0
  })).filter(r => !q || r.name.toLowerCase().includes(q) || r.email.toLowerCase().includes(q))
     .sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));

  if (!rows.length) {
    const p = document.createElement('p'); p.className = 'email';
    p.textContent = Object.keys(members).length ? 'No members match your search.' : 'No members yet.';
    list.appendChild(p); return;
  }

  rows.forEach(r => {
    const card = document.createElement('div'); card.className = 'card';

    const top = document.createElement('div'); top.className = 'member-top';
    const info = document.createElement('div');
    const n = document.createElement('div'); n.className = 'name'; n.textContent = r.name || '(no name)';
    const e = document.createElement('div'); e.className = 'email'; e.textContent = r.email;
    info.appendChild(n); info.appendChild(e);
    const pts = document.createElement('div'); pts.className = 'pts'; pts.textContent = '⭐ ' + r.points;
    top.appendChild(info); top.appendChild(pts);
    card.appendChild(top);

    const row = document.createElement('div'); row.className = 'row';
    const amt = document.createElement('input');
    amt.type = 'number'; amt.min = '0'; amt.step = '1'; amt.placeholder = 'Points'; amt.className = 'amount';
    row.appendChild(amt);

    const mk = (label, cls, fn) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = label;
      b.onclick = async () => {
        const v = parseInt(amt.value, 10);
        if (!Number.isFinite(v) || v < 0) { say('Enter a whole number of points (0 or more).', 'err'); return; }
        b.disabled = true;
        try { await fn(r, v); amt.value = ''; }
        catch (err) { say('Could not save. Check your database rules.', 'err'); }
        b.disabled = false;
      };
      row.appendChild(b);
    };

    mk('+ Add', 'add', async (m, v) => {
      await runTransaction(ref(db, 'members/' + m.uid + '/points'), cur => (Number(cur) || 0) + v);
      say('Added ' + v + ' points to ' + (m.name || m.email) + '.', 'ok');
    });
    mk('− Remove', 'remove', async (m, v) => {
      await runTransaction(ref(db, 'members/' + m.uid + '/points'), cur => Math.max(0, (Number(cur) || 0) - v));
      say('Removed ' + v + ' points from ' + (m.name || m.email) + '.', 'ok');
    });
    mk('Set exactly', 'set', async (m, v) => {
      await set(ref(db, 'members/' + m.uid + '/points'), v);
      say('Set ' + (m.name || m.email) + ' to ' + v + ' points.', 'ok');
    });

    card.appendChild(row);
    list.appendChild(card);
  });
}
</script>
</body>
</html>
