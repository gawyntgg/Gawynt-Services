<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Inbox - Gawynt's Snow Shoveling</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f0f9ff; color: #1e293b; }
        .hidden { display: none !important; }
        .topbar { background: linear-gradient(45deg, #0284c7, #3b82f6); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { margin: 0; font-size: 1.15rem; }
        .topbar button { background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }

        #login { max-width: 360px; margin: 60px auto; background: #fff; padding: 28px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        #login h2 { margin-top: 0; }
        #login input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; }
        #login button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #0284c7; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        .error { color: #b91c1c; font-size: 0.9rem; margin: 8px 0 0; }

        #app { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 52px); }
        #chat-list { background: #fff; border-right: 1px solid #e2e8f0; overflow-y: auto; }
        .chat-item { width: 100%; text-align: left; background: #fff; border: none; border-bottom: 1px solid #f1f5f9; padding: 14px 16px; cursor: pointer; display: block; }
        .chat-item:hover, .chat-item.active { background: #e0f2fe; }
        .chat-item .name { font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .chat-item .last { font-size: 0.85rem; color: #64748b; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; display: inline-block; }
        .empty { padding: 24px; color: #64748b; text-align: center; }

        #convo { display: flex; flex-direction: column; min-width: 0; }
        #convo-title { padding: 14px 18px; background: #fff; border-bottom: 1px solid #e2e8f0; font-weight: 700; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
        .msg.customer { background: #fff; border: 1px solid #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.admin { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg .time { display: block; font-size: 0.7rem; opacity: 0.6; margin-top: 4px; }
        #reply-form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; }
        #reply-input { flex: 1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; }
        #reply-form button { padding: 0 20px; border: none; border-radius: 12px; background: #0284c7; color: #fff; font-weight: 700; cursor: pointer; }

        @media (max-width: 720px) {
            #app { grid-template-columns: 1fr; grid-template-rows: 190px 1fr; }
            #chat-list { border-right: none; border-bottom: 1px solid #e2e8f0; }
            .msg { max-width: 90%; }
        }

        #goal-panel { position: fixed; top: 60px; right: 12px; width: 300px; max-width: calc(100vw - 24px); background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); z-index: 50; }
        #goal-panel h3 { margin: 0 0 12px; }
        #goal-panel label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #475569; }
        #goal-panel input { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; }
        #goal-panel button { width: 100%; padding: 11px; border: none; border-radius: 10px; background: #0284c7; color: #fff; font-weight: 700; cursor: pointer; font-size: 1rem; }
        #goal-status { font-size: 0.85rem; margin: 8px 0 0; min-height: 1em; }
    </style>
</head>
<body>

<div class="topbar">
    <h1>❄️ Chat Inbox</h1>
    <div style="display:flex; gap:8px;">
        <button id="btn-goal" class="hidden">🎯 Goal</button>
        <button id="btn-logout" class="hidden">Log out</button>
    </div>
</div>

<div id="goal-panel" class="hidden">
    <h3>🎯 Update goal progress</h3>
    <label for="goal-current">Money saved so far ($)</label>
    <input type="number" id="goal-current" min="0" step="1" inputmode="decimal">
    <label for="goal-target">Goal amount ($)</label>
    <input type="number" id="goal-target" min="1" step="1" inputmode="decimal">
    <button type="button" id="goal-save">Save to website</button>
    <p id="goal-status"></p>
</div>

<div id="login">
    <h2>Admin login</h2>
    <input type="email" id="login-email" placeholder="Email" autocomplete="username">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button id="btn-login">Log in</button>
    <p id="login-error" class="error hidden"></p>
</div>

<div id="app" class="hidden">
    <div id="chat-list"></div>
    <div id="convo">
        <div id="convo-title">Select a chat</div>
        <div id="messages"></div>
        <form id="reply-form" autocomplete="off" class="hidden">
            <input type="text" id="reply-input" placeholder="Type your reply..." maxlength="500">
            <button type="submit">Send</button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getDatabase, ref, onValue, push, update, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBuWWnqDX5mUra5pF3uuBxEVSKjcESifTk",
        authDomain: "gawynt-hub.firebaseapp.com",
        databaseURL: "https://gawynt-hub-default-rtdb.firebaseio.com",
        projectId: "gawynt-hub",
        storageBucket: "gawynt-hub.firebasestorage.app",
        messagingSenderId: "330651852035",
        appId: "1:330651852035:web:db931f867da21b6a519d36",
        measurementId: "G-XLXGTVSPXT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const el = {
        login: document.getElementById('login'),
        app: document.getElementById('app'),
        email: document.getElementById('login-email'),
        password: document.getElementById('login-password'),
        btnLogin: document.getElementById('btn-login'),
        btnLogout: document.getElementById('btn-logout'),
        loginError: document.getElementById('login-error'),
        list: document.getElementById('chat-list'),
        title: document.getElementById('convo-title'),
        messages: document.getElementById('messages'),
        form: document.getElementById('reply-form'),
        input: document.getElementById('reply-input')
    };

    let chats = {};
    let selectedId = null;
    let listening = false;

    function showLoginError(msg) {
        el.loginError.textContent = msg;
        el.loginError.classList.remove('hidden');
    }

    el.btnLogin.addEventListener('click', function() {
        el.loginError.classList.add('hidden');
        signInWithEmailAndPassword(auth, el.email.value.trim(), el.password.value)
            .catch(function() { showLoginError('Wrong email or password.'); });
    });
    el.password.addEventListener('keydown', function(e) { if (e.key === 'Enter') el.btnLogin.click(); });
    el.btnLogout.addEventListener('click', function() { signOut(auth); });

    onAuthStateChanged(auth, function(user) {
        if (user && user.email) {
            el.login.classList.add('hidden');
            el.app.classList.remove('hidden');
            el.btnLogout.classList.remove('hidden');
            startListening();
        } else {
            el.login.classList.remove('hidden');
            el.app.classList.add('hidden');
            el.btnLogout.classList.add('hidden');
        }
    });

    function startListening() {
        if (listening) return;
        listening = true;
        onValue(ref(db, 'chats'), function(snap) {
            chats = snap.val() || {};
            renderList();
            renderConvo();
        }, function() {
            el.list.innerHTML = '';
            const d = document.createElement('div');
            d.className = 'empty';
            d.textContent = 'Permission denied. Check your Firebase database rules and that you are logged in with the admin account.';
            el.list.appendChild(d);
        });
    }

    function renderList() {
        el.list.innerHTML = '';
        const ids = Object.keys(chats).sort(function(a, b) {
            return ((chats[b].meta && chats[b].meta.updatedAt) || 0) - ((chats[a].meta && chats[a].meta.updatedAt) || 0);
        });
        if (ids.length === 0) {
            const d = document.createElement('div');
            d.className = 'empty';
            d.textContent = 'No chats yet.';
            el.list.appendChild(d);
            return;
        }
        ids.forEach(function(id) {
            const meta = chats[id].meta || {};
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'chat-item' + (id === selectedId ? ' active' : '');
            const name = document.createElement('div');
            name.className = 'name';
            const n = document.createElement('span');
            n.textContent = meta.name || 'Visitor';
            name.appendChild(n);
            if (meta.unread) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                name.appendChild(dot);
            }
            const last = document.createElement('div');
            last.className = 'last';
            last.textContent = meta.lastText || '';
            b.appendChild(name);
            b.appendChild(last);
            b.addEventListener('click', function() { selectChat(id); });
            el.list.appendChild(b);
        });
    }

    function selectChat(id) {
        selectedId = id;
        const meta = (chats[id] && chats[id].meta) || {};
        if (meta.unread) update(ref(db, 'chats/' + id + '/meta'), { unread: false }).catch(function() {});
        renderList();
        renderConvo();
        el.input.focus();
    }

    function renderConvo() {
        if (!selectedId || !chats[selectedId]) {
            el.title.textContent = 'Select a chat';
            el.messages.innerHTML = '';
            el.form.classList.add('hidden');
            return;
        }
        const chat = chats[selectedId];
        el.title.textContent = 'Chat with ' + ((chat.meta && chat.meta.name) || 'Visitor');
        el.form.classList.remove('hidden');
        const list = Object.values(chat.messages || {}).sort(function(a, b) { return (a.ts || 0) - (b.ts || 0); });
        el.messages.innerHTML = '';
        list.forEach(function(m) {
            const d = document.createElement('div');
            d.className = 'msg ' + (m.from === 'admin' ? 'admin' : 'customer');
            d.textContent = m.text;
            const t = document.createElement('span');
            t.className = 'time';
            t.textContent = m.ts ? new Date(m.ts).toLocaleString() : '';
            d.appendChild(t);
            el.messages.appendChild(d);
        });
        el.messages.scrollTop = el.messages.scrollHeight;
    }

    el.form.addEventListener('submit', function(e) {
        e.preventDefault();
        const text = el.input.value.trim();
        if (!text || !selectedId) return;
        el.input.value = '';
        push(ref(db, 'chats/' + selectedId + '/messages'), { from: 'admin', text: text, ts: Date.now() })
            .then(function() {
                return update(ref(db, 'chats/' + selectedId + '/meta'), { updatedAt: Date.now(), lastText: 'You: ' + text, unread: false });
            })
            .catch(function() { alert('Could not send. Check your connection and database rules.'); });
    });

    // --- Goal progress controls ---
    const goalEl = {
        btn: document.getElementById('btn-goal'),
        panel: document.getElementById('goal-panel'),
        current: document.getElementById('goal-current'),
        target: document.getElementById('goal-target'),
        save: document.getElementById('goal-save'),
        status: document.getElementById('goal-status')
    };
    let goalLoaded = false;

    onAuthStateChanged(auth, function(user) {
        if (user && user.email) {
            goalEl.btn.classList.remove('hidden');
            if (!goalLoaded) {
                goalLoaded = true;
                onValue(ref(db, 'settings/goal'), function(snap) {
                    const g = snap.val();
                    if (g && document.activeElement !== goalEl.current && document.activeElement !== goalEl.target) {
                        goalEl.current.value = g.current;
                        goalEl.target.value = g.target;
                    }
                });
            }
        } else {
            goalEl.btn.classList.add('hidden');
            goalEl.panel.classList.add('hidden');
        }
    });

    goalEl.btn.addEventListener('click', function() {
        goalEl.panel.classList.toggle('hidden');
        goalEl.status.textContent = '';
    });

    goalEl.save.addEventListener('click', function() {
        const cur = Number(goalEl.current.value);
        const tgt = Number(goalEl.target.value);
        if (goalEl.current.value === '' || !isFinite(cur) || cur < 0 || !isFinite(tgt) || tgt <= 0) {
            goalEl.status.style.color = '#b91c1c';
            goalEl.status.textContent = 'Enter a saved amount (0 or more) and a goal above 0.';
            return;
        }
        set(ref(db, 'settings/goal'), { current: cur, target: tgt, updatedAt: Date.now() })
            .then(function() {
                goalEl.status.style.color = '#047857';
                goalEl.status.textContent = 'Saved! Your website is updated.';
            })
            .catch(function() {
                goalEl.status.style.color = '#b91c1c';
                goalEl.status.textContent = "Couldn't save. Check your database rules.";
            });
    });
</script>

</body>
</html>
